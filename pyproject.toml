[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socialbot"
version = "1.1.0"
description = "All-in-one open-source social media scheduling & automation bot — post, schedule, auto-engage, and analyze 13+ platforms from one place."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "socialbot contributors" }]
keywords = [
  "social-media", "scheduler", "automation", "bot", "twitter", "mastodon",
  "bluesky", "reddit", "telegram", "discord", "linkedin", "facebook",
  "instagram", "threads", "pinterest", "slack", "posting", "growth",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "requests>=2.28",
  "PyYAML>=6.0",
  "click>=8.1",
  "python-dotenv>=1.0",
  "fastapi>=0.104",
  "uvicorn>=0.24",
  "APScheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.25", "pytest-cov>=4.1"]

[project.scripts]
socialbot = "socialbot.cli:cli"

[project.urls]
Homepage = "https://github.com/rangwalaaliasgar55-bot/socialbot"
Documentation = "https://github.com/rangwalaaliasgar55-bot/socialbot#readme"

[tool.setuptools.packages.find]
include = ["socialbot*"]

[tool.setuptools.package-data]
socialbot = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
